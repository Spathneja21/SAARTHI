services:
  db:
    image: postgres:16
    container_name: aura_postgres
    environment:
      POSTGRES_USER: aura_user
      POSTGRES_PASSWORD: aura_pass
      POSTGRES_DB: aura_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura_user -d aura_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aura_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: aura_api
    environment:
      DATABASE_URL: postgresql+asyncpg://aura_user:aura_pass@db:5432/aura_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    container_name: aura_worker
    command: celery -A workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://aura_user:aura_pass@db:5432/aura_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./ml/artifacts:/app/ml/artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    container_name: aura_beat
    command: celery -A workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+asyncpg://aura_user:aura_pass@db:5432/aura_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
